<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<title>blackbox</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="mode" id="status">&mdash;</div>
  <div class="seg">
    <button class="s on" id="vdial">dial</button>
    <button class="s" id="v3d">3d</button>
  </div>
  <div class="pos" id="pos">blackbox</div>
</header>
<canvas id="horizon"></canvas>
<div class="narr" id="narr">&mdash;</div>
<div class="hud">
  <div class="cell"><div class="k">speed</div><div class="v"><span id="gs">0</span><em>km/h</em></div><div class="cap" id="gscap">&mdash;</div></div>
  <div class="cell"><div class="k">altitude</div><div class="v"><span id="alt">0</span><em>km</em></div><div class="cap" id="altcap">&mdash;</div></div>
  <div class="cell"><div class="k">outside</div><div class="v"><span id="oat">+15</span><em>&deg;C</em></div><div class="cap" id="oatcap">&mdash;</div></div>
  <div class="cell"><div class="k">wind</div><div class="v"><span id="wind">0</span><em>km/h</em></div><div class="cap" id="windcap">&mdash;</div></div>
</div>
<canvas id="profile"></canvas>
<div class="note">auto-lock &rarr; never &middot; window seat &middot; phone flat &middot; keep open</div>
<div id="overlay">
  <h1>black<span>box</span></h1>
  <div class="sub" id="osub">EZY2899 &middot; BRISTOL &rarr; SEVILLE &middot; AIRBUS A320 &middot; DEP 16:40 &middot; works entirely offline &mdash; gps, gyros and maths only</div>
  <div class="btns">
    <button class="primary" id="start">start flight</button>
    <button id="demo">watch a demo</button>
    <button id="reset">reset</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
